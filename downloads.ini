# Nadhr's own build-time dependencies, fetched after the Chromium source and
# before patches are applied. Every entry is pinned by version and checksum.

# Official uBlock Origin release (GPL-3.0), bundled as a component extension.
# Upgrade: update version and sha256 (the release page lists the digest), then
# rebuild; patches/nadhr/ublock/ does not depend on uBlock's file contents.
[ublock_origin]
version = 1.77.2
url = https://github.com/gorhill/uBlock/releases/download/%(version)s/uBlock0_%(version)s.chromium.zip
download_filename = uBlock0_%(version)s.chromium.zip
sha256 = 636cfa6c640b29ab7251b765225d6c0f580bd9fe830d1319005ea7093cf4303c
extractor = 7z
output_path = third_party/ublock
strip_leading_dirs = uBlock0.chromium
