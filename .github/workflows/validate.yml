# Fast checks on every push and pull request (no Chromium build).
name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python sources compile
        run: python -m compileall -q devutils platforms utils
      - name: Unit tests
        run: python -m unittest discover -s utils/tests -v
      - name: Name substitution keeps every translation (real Chromium strings)
        run: python devutils/verify_name_substitution.py
      - name: Nadhr patches apply to the pinned Chromium release
        run: python devutils/validate_patches.py --platform windows --remote
