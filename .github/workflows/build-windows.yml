  complete:
    needs: stage-16
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the build finished
        run: |
          if [ "${{ needs.stage-16.outputs.finished }}" != "true" ]; then
            echo "Build did not finish within 16 stages."
            exit 1
          fi
