        with:
          finished: ${{ needs.stage-3.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  stage-5:
    needs: stage-4
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.stage-4.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  stage-6:
