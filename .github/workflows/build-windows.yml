# Builds Nadhr for Windows x64 on free GitHub-hosted runners.
# A full Chromium build needs far longer than one job's 6 h limit, so it is
# split into chained stages; each stage resumes the previous one's tree.
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-1:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  stage-2:
    needs: stage-1
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.stage-1.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  stage-3:
    needs: stage-2
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.stage-2.outputs.finished }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  stage-4:
    needs: stage-3
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
